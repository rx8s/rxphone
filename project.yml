name: RxPhone
options:
  bundleIdPrefix: com.rx8s
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
targets:
  RxPhone:
    type: application
    platform: iOS
    sources: [RxPhone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rx8s.rxphone
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RxPhone
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "RxPhone ใช้สิทธิ์นี้เพื่อแสดง จัดเรียง และลบรูปภาพกับวีดีโอในเครื่องตามที่คุณเลือก"
    scheme:
      testTargets: [RxPhoneTests, RxPhoneUITests]
  RxPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RxPhoneTests]
    dependencies:
      - target: RxPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rx8s.rxphone.tests
        GENERATE_INFOPLIST_FILE: YES
  RxPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RxPhoneUITests]
    dependencies:
      - target: RxPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rx8s.rxphone.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RxPhone
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
